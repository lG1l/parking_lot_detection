[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python",
    "numpy",
    "ultralytics>=8.4.213",
    "pillow>=13.0.0",
    "trackers==2.6.1",
    "supervision==0.31.7",
    "openai>=3.55.1",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
