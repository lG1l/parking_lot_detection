[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python",
    "numpy",
    "ultralytics>=8.4.213",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
