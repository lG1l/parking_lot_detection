# 백엔드 EC2 배포 (D-125). 사람이 CI 성공을 확인한 뒤 수동으로 실행한다 (D-130).
# 서버 .env를 Secrets 값으로 다시 쓰고 갱신 스크립트를 돌린다 (D-123, D-163).
name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      ip:
        description: 백엔드 EC2 퍼블릭 IP
        required: true
        type: string

permissions: {}

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IP: ${{ inputs.ip }}
    steps:
      - name: IP 형식 확인
        run: '[[ $IP =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "IP 형식이 아니다"; exit 1; }'

      # IP는 켤 때마다 바뀌지만 호스트 키는 그대로라 별칭(backend)으로 대조한다.
      # 키가 다르면 접속을 끊어 .env를 엉뚱한 서버에 보내지 않는다
      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}
          HOST_KEY: ${{ secrets.BACKEND_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'backend %s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host backend\n  HostName %s\n  User ubuntu\n  HostKeyAlias backend\n  StrictHostKeyChecking yes\n  BatchMode yes\n' "$IP" > ~/.ssh/config

      # 비밀값은 명령 인자가 아니라 표준 입력으로 보낸다. 파일 권한은 600 (D-123)
      - name: 서버 .env 쓰기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET_PREFIX: ${{ secrets.S3_BUCKET_PREFIX }}
          SQS_QUEUE_URL: ${{ secrets.SQS_QUEUE_URL }}
          GPU_INSTANCE_ID: ${{ secrets.GPU_INSTANCE_ID }}
        run: |
          {
            echo "APP_MODE=aws"
            echo "AWS_REGION=ap-northeast-2"
            echo "DATABASE_URL=$DATABASE_URL"
            echo "S3_BUCKET_PREFIX=$S3_BUCKET_PREFIX"
            echo "SQS_QUEUE_URL=$SQS_QUEUE_URL"
            echo "GPU_INSTANCE_ID=$GPU_INSTANCE_ID"
          } | ssh backend 'umask 077 && cat > /home/ubuntu/app/backend/.env'

      - name: 갱신 스크립트 실행
        run: ssh backend sudo /home/ubuntu/app/backend/deploy/update.sh
