[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "bcrypt",
    "pydantic-settings",
    "boto3",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["S608", "PGH004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
